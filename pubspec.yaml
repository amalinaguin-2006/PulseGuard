name: pulse_guard
description: "PulseGuard — Mobile biometric stress & autonomic telemetry via camera-based PPG."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

# ──────────────────────────────────────────────────────────────────────────────
# DEPENDENCIES
# ──────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Camera & Permissions ──────────────────────────────────────────────────
  # High-speed frame streaming from rear camera + torch/flashlight control.
  camera: ^0.11.1
  # Runtime permission requests (camera, etc.) with platform-aware dialogs.
  permission_handler: ^11.4.0

  # ── Local Storage (SQLite) ────────────────────────────────────────────────
  # On-device edge database for user profiles, questionnaires, and PPG logs.
  sqflite: ^2.4.2
  # Path resolution for locating the database file on the device filesystem.
  path: ^1.9.1

  # ── UI / Typography / Charts ──────────────────────────────────────────────
  # Google Fonts for premium typography (Inter, Roboto Mono, etc.).
  google_fonts: ^6.2.1
  # High-performance 2-D chart library for live PPG waveform oscilloscope.
  fl_chart: ^0.70.2
  image_picker: ^1.2.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# ──────────────────────────────────────────────────────────────────────────────
# FLUTTER CONFIGURATION
# ──────────────────────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true

  # Asset directories — icons, images, and any future static resources.
  assets:
    - assets/images/
